[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-agent"
version = "0.1.0"
description = "Multi-country automated tax filing agent"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "playwright>=1.40",
    "python-dateutil>=2.8",
    "claude-agent-sdk>=0.1.0",
]

[tool.setuptools]
py-modules = ["tax_agent"]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.3",
]